<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS 499 ePortfolio - Kislev Paguada</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #24292e; }
    pre { background: #f6f8fa; padding: 16px; overflow: auto; border-radius: 6px; }
    code { font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
  </style>
</head>
<body>
  <div id="content">Loading portfolio...</div>
  <script>
    fetch('README.md')
      .then(response => response.text())
      .then(text => { document.getElementById('content').innerHTML = marked.parse(text); });
  </script>
</body>
</html>
